version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: smart_video_annotation
      POSTGRES_USER: sva_user
      POSTGRES_PASSWORD: sva_password
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://sva_user:sva_password@db:5432/smart_video_annotation
      - SECRET_KEY=your-secret-key-change-in-production
    depends_on:
      - db

volumes:
  postgres_data:
  media_volume:

